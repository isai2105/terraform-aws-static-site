# Apply or destroy one environment, on demand, from a plan somebody can read.
#
# Nothing in this repository deploys on merge, and that is a decision rather
# than an omission: this is a reference implementation whose environments are
# meant to be stood up, looked at and torn down again, so a merge trigger would
# leave a CloudFront distribution running for every pull request that touched a
# comment. What replaces it is a dispatch — a named environment, a named
# action, an audited run — and `destroy` is one of the two actions rather than
# something typed into a terminal at midnight. A teardown that only exists as a
# local command is a teardown with no log, no gate and no record of who ran it.
#
# The gate is the GitHub Environment, and it is load-bearing in two directions
# at once. `prod` carries a required reviewer, so a job that names it waits for
# a human; both environments carry a deployment branch policy of `main`, so a
# dispatch from a topic branch is refused before any AWS call is made. That
# second half has to live in GitHub rather than in IAM, because naming an
# environment *replaces* the ref component of the OIDC subject with
# `environment:<name>` instead of adding to it — there is one apply role per
# environment and each is trusted on exactly one of those subjects and on no ref
# at all (bootstrap/oidc.tf records the claim as it was observed). Declaring
# `environment:` is therefore not decoration on these jobs: without it they
# cannot authenticate to AWS, and with it the reviewer requirement is real.
#
# Two jobs rather than one, and the split is the point of the file. `plan`
# writes a plan file and publishes it; `apply` downloads that file and applies
# *it*, never a plan of its own. A `terraform apply` with no plan file computes
# a fresh plan and applies it in the same breath, which is to say it applies
# something nobody has read — and on prod that would mean the required reviewer
# approving a run before the plan they are approving exists. Split, the
# reviewer approves the second job with the first job's plan in front of them,
# and what gets applied is the artefact they looked at rather than a plan taken
# again a minute later. Terraform enforces the rest: a saved plan whose state
# has moved on is refused as stale rather than applied on top of the change.
#
# The bill for that, on prod, is two approvals rather than one, and it is
# measured rather than assumed. A job that names an environment creates a
# deployment against it, and both of these jobs name one: the stage destroy of
# 2026-08-28 (run 33195420483) produced deployments 6145745999 and 6145752607,
# one per job, each passing through its own `waiting` state — the state prod's
# required reviewer holds a deployment in. So a prod dispatch asks for the
# reviewer twice, once to take the plan and once to apply it, and the second
# request is the one with something to read. Worth knowing before the second
# prompt arrives and reads like a stuck run.
#
# The hardening rules this file follows — SHA-pinned actions checked for
# `using: node24`, `permissions: {}` widened per job, `runs-on: ubuntu-24.04`, a
# `timeout-minutes` on every job and `persist-credentials: false` on every
# checkout — are stated once and in full at the top of validate.yml, together
# with which of them the `zizmor` job there actually enforces and which are held
# by hand. Both of the timeouts below are larger than that file's fifteen
# minutes, and each is argued where it sits.

name: apply

# The Actions list would otherwise show five identical rows named "apply", four
# of which were destroys. This is an audit trail; it should read like one.
run-name: ${{ inputs.action }} ${{ inputs.environment }}

on:
  workflow_dispatch:
    inputs:
      # `choice`, not `string`, and the reason is specific rather than tidiness.
      # GitHub creates an environment implicitly the first time a job names
      # one, with no protection rules at all, so a free-text box makes `prd` a
      # single keystroke away from an environment that looks configured because
      # it now exists. That one stops at `AssumeRoleWithWebIdentity` — there is
      # one apply role per environment and no role's trust names anything but
      # `stage` or `prod` — so what it costs is a confusing failure and a stray
      # environment somebody has to notice and delete, rather than an unreviewed
      # deploy.
      #
      # `Prod` is the one that is genuinely unclear. Environment names are
      # matched case-insensitively for uniqueness, but which spelling GitHub
      # then puts in the `sub` claim when the reference and the stored name
      # differ in case is not something this repository has measured, and the
      # rest of it is careful to say when a claim was read out of a real token.
      # A closed list is what makes the question not need an answer.
      #
      # The two options are a contract with three things outside this file: the
      # directories under envs/, the `environments` list in
      # bootstrap/variables.tf (which mints one apply role per name and scopes
      # each one's trust and state grants to that name), and the GitHub
      # Environments themselves. The job below asserts the first of those at run
      # time; the rest announce themselves as an AssumeRole failure naming the
      # subject, which is at least a failure that points at its own cause.
      environment:
        description: Which environment to act on
        type: choice
        options:
          - stage
          - prod
        default: stage

      # A `choice` input always arrives with one option preselected — there is
      # no unset state to force a decision — so the preselected one is stated
      # here rather than inherited from the order of the list, and it is the
      # action that removes nothing.
      action:
        description: Apply the environment, or destroy it
        type: choice
        options:
          - apply
          - destroy
        default: apply

# Nothing by default, granted back per job below. Both jobs take the same two —
# `contents: read` to check out, `id-token: write` to mint the OIDC token the
# environment's apply role is assumed with — and neither is granted write on
# anything in the repository, in the workflow that has the most to write to.
#
# One absence is worth naming, because it is the grant a reader goes looking
# for: moving the plan artefact from the first job to the second needs no
# `actions:` permission. actions/upload-artifact and actions/download-artifact
# authenticate to the artifact service with the runner's own short-lived token
# rather than with `GITHUB_TOKEN`, so the transport that makes this file's
# two-job split work costs nothing here.
permissions: {}

# One group per environment, because the thing being protected is the state
# file and there is one of those per environment. Two runs applying `stage` at
# once would fight over the state lock at best and interleave two applies at
# worst; a run applying `stage` while another applies `prod` is two unrelated
# operations and should not queue.
#
# It serialises this workflow against itself and nothing more. plan.yml groups
# on `plan-${github.ref}`, so a pull request planning `stage` can run beside an
# apply of `stage`, and the two meet at the state lock rather than here — where
# the apply wins, because it holds the lock through resource creation and
# plan.yml waits five minutes for it. A pull-request plan going red against a
# running apply is therefore expected rather than a fault, and re-running it
# afterwards is the answer. Merging the two groups would fix that at the price
# of a pull-request plan being able to make a dispatch wait, which is the wrong
# way round.
#
# `cancel-in-progress: false` for a stronger reason here than in plan.yml.
# Cancelling a plan strands a lock; cancelling an *apply* strands a lock and
# leaves the infrastructure half-changed, with the state file describing
# neither what was there before nor what is there now. A run that has started
# is therefore never cancelled to make room for a newer one.
#
# What it does not do — and this is worth writing down, because a queue is the
# natural thing to read into it — is queue more than one. GitHub holds a single
# pending run per group and cancels the previous pending one when a third
# arrives, so with a prod approval outstanding a dispatch can be evicted before
# it ever runs. Its run appears in the history as cancelled rather than
# disappearing, which is the property that makes this liveable on a workflow
# whose point is its audit trail, but the operator watching for their dispatch
# to start has to know to look.
concurrency:
  group: apply-${{ inputs.environment }}
  cancel-in-progress: false

env:
  # Suppresses the "now run terraform apply" advice Terraform prints for a
  # human at a terminal. Nothing here is at a terminal.
  TF_IN_AUTOMATION: "1"

jobs:
  # Produce the plan, publish it, and show it to whoever has to approve the
  # apply.
  #
  # This job names the environment too, and has to: the only credential that
  # can reach prod state from here is prod's own apply role, and it is trusted
  # on the `environment: prod` subject alone. So on prod this waits for the
  # reviewer before it runs at all — the first of the two approvals the header
  # accounts for. That is not really a cost either: a plan refreshes, which
  # means it takes the state lock and talks to the account, so approving it is
  # approving something real even though it writes nothing.
  plan:
    name: plan (${{ inputs.action }} ${{ inputs.environment }})
    runs-on: ubuntu-24.04
    # Twenty rather than the fifteen the pull-request path carries, for one
    # concrete difference: the plan below waits `-lock-timeout=10m` for the
    # state lock where plan.yml waits five, and a cap has to sit above the wait
    # underneath it or it fires on the run that was about to succeed.
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      # The OIDC token exchanged for this environment's apply role.
      id-token: write
    outputs:
      # When the plan artefact became downloadable, which is what the freshness
      # check in the apply job measures against. Recorded here rather than
      # derived from the run's start time: the thing with an expiry is the
      # upload, and a run can wait a long time before reaching it.
      published-at: ${{ steps.published.outputs.epoch }}
    steps:
      # A fresh clone with no bootstrap behind it has none of these set, and
      # every one of them fails somewhere unhelpful: an empty role ARN reads as
      # "Credentials could not be loaded", an empty bucket as an S3 error about
      # a name that is not in the file. The runbook sets them in two places:
      # the first two on the repository in section 6, AWS_APPLY_ROLE_ARN on
      # each GitHub Environment at the end of section 7.4.
      #
      # That split is not bookkeeping. There is one apply role per environment,
      # and `vars` resolves an environment-scoped value ahead of a
      # repository-scoped one for a job that declares an environment — which is
      # what lets the single expression below mean stage's role on a stage
      # dispatch and prod's on a prod one, with no branch in this file. The
      # failure mode it introduces is an environment created without its
      # variable, and that reads here as empty rather than as wrong.
      #
      # Checked here only. The apply job cannot start unless this one
      # succeeded, so a second copy of this step would assert something already
      # known and drift from this one the first time the list changes.
      - name: Check the variables this workflow needs
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_APPLY_ROLE_ARN: ${{ vars.AWS_APPLY_ROLE_ARN }}
        shell: bash
        run: |
          missing=()
          for name in TF_STATE_BUCKET AWS_REGION AWS_APPLY_ROLE_ARN; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::unset variables: ${missing[*]}. TF_STATE_BUCKET and" \
              "AWS_REGION are repository variables; AWS_APPLY_ROLE_ARN is set on" \
              "each GitHub Environment, so an empty one most often means it was" \
              "set on the repository instead. All of them come from the" \
              "bootstrap's repository_variable_commands output; see sections 6" \
              "and 7.4 of docs/BOOTSTRAP.md"
            exit 1
          fi

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The dispatch input is a closed list, but the list is written in this
      # file and the directories it names are not. An environment renamed or
      # removed under envs/ without the options above being updated would reach
      # `terraform -chdir` as a chdir failure several steps and one approval
      # later; the reverse — a directory that exists and is absent from the
      # list — is an environment nothing can deploy, and that one is only ever
      # caught by a person reading the comment above. Cheap to say so here.
      - name: Check the environment exists
        shell: bash
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          if [ ! -d "envs/${ENVIRONMENT}" ]; then
            echo "::error::envs/${ENVIRONMENT} does not exist; the workflow_dispatch" \
              "options in .github/workflows/apply.yml and the directories under" \
              "envs/ have to name the same environments"
            exit 1
          fi

      - name: Read the pinned Terraform version
        id: terraform-version
        # As in validate.yml and plan.yml: setup-terraform has no version-file
        # input and defaults to `latest`, so .terraform-version is read here and
        # passed in explicitly.
        #
        # The value is checked rather than interpolated straight into the
        # output. An empty one is not an error setup-terraform reports — it
        # falls back toward `latest` — and this is the workflow where an
        # unpinned Terraform would be the one writing state.
        shell: bash
        run: |
          version="$(cat .terraform-version)"
          if [ -z "$version" ]; then
            echo "::error::.terraform-version is empty; the plan would run on" \
              "an unpinned Terraform"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.terraform-version.outputs.version }}
          # The wrapper rewrites stdout to publish it as step outputs, which
          # would mangle the plan text captured below, and nothing here reads
          # those outputs.
          terraform_wrapper: false

      - name: Assume the apply role
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          # The session name is what CloudTrail records, so it is made to say
          # which run, which environment and which of the two actions rather
          # than "GitHubActions".
          role-session-name: ${{ inputs.action }}-${{ inputs.environment }}-${{ github.run_id }}

      # Terraform is invoked directly rather than through the Makefile, for the
      # reason plan.yml gives: the Makefile's targets init with
      # `-backend-config=backend.hcl`, a gitignored per-account file that does
      # not exist on a runner. CI's four backend values come from repository
      # variables instead.
      #
      # The state key is built from the environment name rather than written
      # down, because that name is the same string in four places — this input,
      # the directory under envs/, the key the apply role's policy scopes its
      # grants to, and the GitHub Environment named above.
      - name: Initialise the backend
        shell: bash
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_REGION: ${{ vars.AWS_REGION }}
        run: |
          terraform -chdir="envs/${ENVIRONMENT}" init \
            -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${ENVIRONMENT}/terraform.tfstate" \
            -backend-config="region=${TF_STATE_REGION}" \
            -backend-config="use_lockfile=true" \
            2>&1 | tee "${RUNNER_TEMP}/init.log"

      # `-out` is the whole mechanism: it is what makes the apply below apply a
      # reviewed artefact instead of a fresh opinion. The file is named
      # `terraform.tfplan` so that the repository's existing `*.tfplan` ignore
      # rule already covers it — a plan file is exactly the thing that must
      # never be committed, and a name the ignore rules do not match is a name
      # that relies on nobody ever running these commands in a working tree.
      #
      # `-lock-timeout` is longer than plan.yml's five minutes. A pull-request
      # plan that loses the race for the state lock is re-run by pushing; a
      # dispatch that loses it has to be dispatched again and, on prod,
      # approved again. Waiting is cheaper than spending a human's attention
      # twice.
      - name: Plan
        id: plan
        shell: bash
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          ACTION: ${{ inputs.action }}
        run: |
          # `-destroy` turns this into a plan to remove everything the state
          # describes, which `terraform apply` then executes exactly as it
          # executes any other saved plan. That is what makes a destroy here
          # the same reviewable, artefact-carrying operation an apply is,
          # rather than a second code path with its own failure modes.
          destroy=()
          if [ "$ACTION" = destroy ]; then
            destroy=(-destroy)
          fi

          terraform -chdir="envs/${ENVIRONMENT}" plan \
            "${destroy[@]}" \
            -out=terraform.tfplan \
            -no-color \
            -input=false \
            -lock-timeout=10m \
            2>&1 | tee "${RUNNER_TEMP}/plan.log"

      # The artefact is the transport, not a souvenir: the apply job has no
      # other way to obtain this file, and applying anything else would defeat
      # the split.
      #
      # `retention-days: 1` because of what a plan file is and where this one
      # is published. On a public repository the Actions artifacts REST
      # endpoint is readable without authentication, and a plan file is a zip
      # whose members are the plan, the configuration snapshot and — this is
      # the part worth being exact about — `tfstate` and `tfstate-prev`, the
      # prior state verbatim. So it exposes every attribute of every resource
      # the environment already has, not only the ones the plan touches, with
      # anything marked `sensitive` resolved: the format does not redact.
      # Nothing in this repository is marked sensitive and no secret value
      # reaches this state, which is what makes an unauthenticated reader
      # acceptable here and would not make it acceptable elsewhere — a
      # repository whose state holds a secret has to encrypt the artefact
      # before uploading it. Gitignoring plan files and then publishing them
      # through a more open channel would be the same mistake made twice.
      #
      # A day is also, unavoidably, a bound on something else: GitHub keeps a
      # pending deployment approval alive for thirty days, and this artefact is
      # the only copy of what that approval would authorise. An approval given
      # on Monday for a plan taken on Friday has nothing left to apply.
      #
      # Rather than raise the retention to cover thirty days of exposure, the
      # bound is made explicit and enforced in the apply job below: a plan is
      # an authorisation to make one specific change to an account that has
      # been moving underneath it ever since, not a standing permission, and
      # one that has sat unapproved for the better part of a day should be
      # taken again rather than honoured. Terraform's own staleness check does
      # not cover this — it compares state serials, and an account can drift a
      # long way without the state file moving at all.
      - name: Upload the plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # `run_attempt`, not just `run_id`. An artefact name has to be unique
          # within a run, and `run_id` is constant across attempts — so "Re-run
          # all jobs" would re-upload under a name attempt one already took and
          # fail on a 409 before ever reaching the apply. The run id stays
          # because the artefact outlives the page it was downloaded from and
          # should say which run produced it.
          #
          # The other half of the same coin: re-running the apply job alone
          # looks for an artefact this attempt never uploaded, and would fail
          # even if it found one, because a plan whose apply already started is
          # stale. A failed apply is re-dispatched, not partially re-run.
          name: terraform-plan-${{ inputs.environment }}-${{ inputs.action }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: envs/${{ inputs.environment }}/terraform.tfplan
          retention-days: 1
          # The default logs a warning and uploads nothing at all, which moves
          # the failure to the download step in the next job — after the prod
          # reviewer has approved it, and reported as a missing artefact rather
          # than as a plan that was never written.
          if-no-files-found: error

      - name: Record when the plan was published
        id: published
        shell: bash
        run: echo "epoch=$(date -u +%s)" >> "$GITHUB_OUTPUT"

      # The plan — or, when there is no plan, whatever stopped there being one
      # — on the run's own summary page.
      #
      # This is the same argument plan.yml makes for its sticky comment, in the
      # place this workflow has instead of a pull request: GitHub's "Review
      # deployments" dialog opens on the run page, so the summary is directly
      # beside the button the prod reviewer is about to press. Without it,
      # approving the apply means going and finding a log first, and an
      # approval that is inconvenient to inform is an approval that gets given
      # uninformed.
      #
      # `if: always()`, and for the reason plan.yml gives rather than for
      # symmetry. The likeliest failure in this job is not the plan, it is
      # `init` — an unset repository variable, a state key the role is not
      # granted, an AssumeRole that was refused — and on prod that failure
      # happens *after* somebody approved the job. A summary that appears only
      # when everything worked is missing on exactly the runs that need
      # explaining.
      - name: Publish the plan to the run summary
        if: always()
        shell: bash
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          ACTION: ${{ inputs.action }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
        run: |
          # A step summary is capped at 1 MiB and is dropped wholesale when it
          # is exceeded, so the budget leaves room for the markdown wrapped
          # around the output. The tail is kept rather than the head: Terraform
          # prints its verdict last. `iconv -c` drops the partial character
          # `tail -c` can leave at the cut.
          budget=900000

          # The plan log when a plan ran, the init log otherwise. Which file
          # exists is also how far the job got, and that is read from the files
          # rather than from `steps.plan.outcome`: a step that never ran because
          # an earlier one failed is absent from the `steps` context entirely,
          # so its outcome is the empty string rather than "skipped", and an arm
          # written for "skipped" would never fire.
          if [ -s "${RUNNER_TEMP}/plan.log" ]; then
            log="${RUNNER_TEMP}/plan.log"
          elif [ -s "${RUNNER_TEMP}/init.log" ]; then
            log="${RUNNER_TEMP}/init.log"
          else
            log=""
          fi

          # As in plan.yml: markdown wants backticks and a shell reads one as
          # command substitution, so they are composed from an escape rather
          # than written out. The fence is four of them, so a fence inside the
          # plan output cannot close it early.
          tick="$(printf '\140')"
          fence="${tick}${tick}${tick}${tick}"

          if [ "$PLAN_OUTCOME" = success ]; then
            # Terraform's own one-line verdict, which is the line a reviewer
            # reads first. Quoted rather than reconstructed.
            headline="$(grep -m 1 -E '^(Plan: |No changes\.)' "$log" || true)"
            : "${headline:=The plan succeeded.}"
            preamble="This is the plan the apply job will apply, as a saved"
            preamble="${preamble} plan: nothing is recomputed after this point."
          elif [ "$log" = "${RUNNER_TEMP}/plan.log" ]; then
            headline="**The plan failed, so there is nothing to approve.**"
            preamble=""
          elif [ -n "$log" ]; then
            headline="**${tick}terraform init${tick} failed, so no plan was produced.**"
            preamble=""
          else
            headline="**The job failed before Terraform ran.**"
            preamble=""
          fi

          {
            printf '### Terraform %s: %s%s%s\n\n' \
              "$ACTION" "$tick" "$ENVIRONMENT" "$tick"
            printf '%s\n\n' "$headline"
            if [ -n "$preamble" ]; then
              printf '%s\n\n' "$preamble"
            fi
            printf '<details><summary>Show Terraform output</summary>\n\n'
            printf '%sterraform\n' "$fence"
            if [ ! -s "$log" ]; then
              printf 'No Terraform output was captured. See the run log.\n'
            elif [ "$(wc -c < "$log")" -gt "$budget" ]; then
              printf '[truncated to the last %s characters; the full output is in the run log]\n\n' "$budget"
              tail -c "$budget" "$log" | iconv -c -f UTF-8 -t UTF-8
            else
              cat "$log"
            fi
            printf '\n%s\n\n' "$fence"
            printf '</details>\n'
          } >> "$GITHUB_STEP_SUMMARY"

  # Apply the plan the job above published, and nothing else.
  #
  # The steps up to `init` are deliberately a repeat of that job's: a second
  # runner is a second empty machine, and there is no state to inherit but the
  # artefact. Factoring them into a composite action would replace forty lines
  # of ordinary workflow with a second file and an indirection, in the one
  # workflow that most wants to be readable end to end by someone deciding
  # whether to approve it.
  apply:
    name: apply (${{ inputs.action }} ${{ inputs.environment }})
    needs: plan
    runs-on: ubuntu-24.04
    # Two hours, and the number is chosen against one specific ceiling rather
    # than against how long an apply usually takes. The AWS provider waits on a
    # CloudFront distribution's deletion with a hardcoded 90-minute waiter and
    # no configurable `timeouts` block, so 90 minutes is also the longest a
    # genuinely stuck destroy can hold this job: past it the provider gives up
    # on its own and Terraform returns an error.
    #
    # That is what makes any cap below 90 the wrong instrument. It cannot fire
    # on a hang — the hang ends by itself first — so the only thing it can ever
    # interrupt is an operation still legitimately in progress, and
    # interrupting one is a SIGKILL mid-delete: the `.tflock` object stranded
    # until somebody runs `force-unlock`, and a half-removed distribution the
    # state no longer describes. Which is precisely the outcome
    # `cancel-in-progress: false` above exists to avoid, arrived at from the
    # other direction.
    #
    # So the cap sits above the waiter, with room for the propagation either
    # side of it, and what it actually bounds is the case neither the waiter
    # nor `-lock-timeout` covers: a runner wedged somewhere with no timeout of
    # its own. Against GitHub's default of six hours that is the whole value —
    # six hours of a job holding the state lock while the infrastructure it was
    # dispatched to remove keeps running.
    timeout-minutes: 120
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      # A plan is an authorisation to make one particular change, and it goes
      # off. The artefact it lives in is kept for a day (see the upload step),
      # while GitHub will hold a pending approval for thirty — so on prod an
      # approval can easily outlive the thing it approves.
      #
      # Twenty hours rather than twenty-four, so that it is this check that
      # reports the problem and not `download-artifact` failing to find a file,
      # which says only "Unable to find any artifacts for the associated
      # workflow" and leaves the reader to work out why. Neither outcome
      # applies anything, so this buys a sentence rather than a safety
      # property; the sentence is the difference between re-dispatching
      # immediately and going to look for a bug.
      - name: Check the plan is still fresh enough to apply
        shell: bash
        env:
          PUBLISHED_AT: ${{ needs.plan.outputs.published-at }}
        run: |
          # An empty output means the plan job did not reach the step that sets
          # it, which `needs:` should already have made impossible. Treated as
          # a reason to stop rather than as a zero: `$(( ))` on an empty string
          # is an arithmetic error, and an age computed from the epoch would
          # fail this check for a reason that has nothing to do with the plan.
          if [ -z "$PUBLISHED_AT" ]; then
            echo "::error::the plan job did not record when it published the" \
              "plan, so its age cannot be checked"
            exit 1
          fi

          age_hours=$(( ( $(date -u +%s) - PUBLISHED_AT ) / 3600 ))
          echo "the plan was published ${age_hours}h ago"

          if [ "$age_hours" -ge 20 ]; then
            echo "::error::this plan was taken ${age_hours} hours ago and is no" \
              "longer safe to apply — the account has had that long to drift" \
              "underneath it, and its artefact is kept for 24 hours. Dispatch" \
              "the workflow again to take a fresh plan."
            exit 1
          fi

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Into the environment's own directory, which is where `-chdir` will
      # look for it and where the backend gets initialised below.
      #
      # The configuration this apply runs is not the one in that directory: a
      # plan file carries its own snapshot of the configuration it was taken
      # from, and `terraform apply <plan>` uses that snapshot rather than the
      # working tree. So the artefact is the unit of review for the change
      # itself — an edited checkout could not alter what the reviewer approved.
      #
      # What the snapshot does not cover is where the state comes from: that is
      # the backend block in the checkout plus the `-backend-config` values
      # below, both read at this ref. Both jobs check out the same commit of
      # the same run, so they cannot disagree within a run; the claim is
      # "nothing between the plan and the apply can change either", not "the
      # plan file decides both".
      - name: Download the plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: terraform-plan-${{ inputs.environment }}-${{ inputs.action }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: envs/${{ inputs.environment }}

      - name: Read the pinned Terraform version
        id: terraform-version
        # The same version that took the plan, because it is read from the same
        # file at the same commit. A saved plan records the exact Terraform
        # version that produced it and is refused by any other, so a drift
        # between these two jobs could only ever surface as a plan that will
        # not open — never as the wrong thing applied — but it would surface
        # after the approval, which is the expensive place to find it.
        shell: bash
        run: |
          version="$(cat .terraform-version)"
          if [ -z "$version" ]; then
            echo "::error::.terraform-version is empty; the apply would run on" \
              "an unpinned Terraform"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.terraform-version.outputs.version }}
          terraform_wrapper: false

      - name: Assume the apply role
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: ${{ inputs.action }}-${{ inputs.environment }}-${{ github.run_id }}

      # The same backend arguments the plan was taken with, because a plan is
      # only meaningful against the state it was computed from. Terraform holds
      # the line if they ever diverge — a saved plan carries the lineage and
      # serial of that state and is refused as stale when what it finds has
      # moved on — so the cost of getting these four values wrong is a failed
      # apply rather than an apply against the wrong environment.
      - name: Initialise the backend
        shell: bash
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_REGION: ${{ vars.AWS_REGION }}
        run: |
          terraform -chdir="envs/${ENVIRONMENT}" init \
            -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${ENVIRONMENT}/terraform.tfstate" \
            -backend-config="region=${TF_STATE_REGION}" \
            -backend-config="use_lockfile=true"

      # Narrow the credential a destroy runs on to this environment's own
      # distribution. docs/CLOUDFRONT_IAM_SCOPING_PLAN.md A4.
      #
      # The apply role holds `cloudfront:DeleteDistribution` and
      # `cloudfront:UpdateDistribution` on `Resource: "*"`, and that is not
      # sloppiness: CloudFront's create operations take no resource type at all
      # in AWS's authorization model, so the statement that grants the create
      # cannot be narrowed and the destructive verbs have ridden along with it.
      # What *is* knowable by the time a destroy runs is the id AWS assigned
      # this environment's distribution — it is in the state this job has just
      # initialised — and a destroy is the only thing that needs those verbs.
      # So the credential is re-minted below with a session policy naming that
      # one ARN, and the same call against anything else in the account is
      # refused for the length of that session.
      #
      # Two new steps rather than one, and both are new here where `e2e.yml`
      # only had to extend a step it already had: this workflow runs no
      # `terraform output` anywhere else, because the artefact split means it
      # has never needed to read anything back out of state.
      #
      # Gated on the destroy action. On an apply there is nothing to pin to —
      # the distribution may not exist yet, and on a first apply certainly does
      # not — and the apply is the operation whose whole job is to call the
      # creates this cannot narrow anyway.
      #
      # **Nothing between here and "Apply the plan" may fail the job.** That
      # step carries the default `if: success()`, so anything that goes red in
      # between skips the destroy entirely and leaves the environment standing
      # — precisely the fail-closed outcome A4 rules out. There are two ways to
      # go red and each needs its own guard: every command in *this* step is
      # written so it cannot exit non-zero, and the re-assume below carries
      # `continue-on-error: true` because it is a live
      # `AssumeRoleWithWebIdentity` against AWS and no amount of care in this
      # step can stop that call failing.
      - name: Build the destroy-time session policy
        id: session-policy
        if: inputs.action == 'destroy'
        shell: bash
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          ROLE_ARN: ${{ vars.AWS_APPLY_ROLE_ARN }}
        run: |
          policy=""

          # The partition and the account id are parsed out of the role ARN
          # this job has already assumed, rather than read back from
          # `aws sts get-caller-identity`.
          #
          # The partition first, because that is a correctness bug rather than
          # a preference. An earlier draft hardcoded `arn:aws:`, and a wrong
          # ARN inside a `Deny` + `NotResource` is not a harmless no-op: the
          # real ARN is then absent from `NotResource`, so the Deny matches the
          # destroy's *own* `UpdateDistribution` (the disable) and
          # `DeleteDistribution`, and the environment strands half torn down.
          # On aws-us-gov or aws-cn that would fire on every destroy through
          # this path, every time. `bootstrap/oidc.tf` composes every ARN it
          # writes from `data.aws_partition.current.partition` and hardcodes
          # none; this is the same rule one layer out.
          #
          # It also removes the only live AWS call this step used to make, from
          # a step whose entire contract is that it cannot fail —
          # `get-caller-identity` can time out, and its `|| true` then produced
          # the unnarrowed fallback silently. The role ARN is a workflow
          # variable, and it is already non-empty by the time this job exists:
          # the plan job this one depends on refuses to run without it, and the
          # step above assumed the role with it. A malformed one is handled by
          # the pattern rather than assumed away — no match, no policy, and the
          # fail-open branch below.
          partition=""
          account=""
          if [[ "$ROLE_ARN" =~ ^arn:([a-z0-9-]+):iam::([0-9]{12}):role/.+$ ]]; then
            partition="${BASH_REMATCH[1]}"
            account="${BASH_REMATCH[2]}"
          fi

          # `|| true` *and* a shape check, and both halves are load-bearing.
          #
          # `terraform output -raw <name>` exits non-zero on an output that
          # does not exist, which the `|| true` absorbs — but against a state
          # carrying no outputs at all it prints `Warning: No outputs found` to
          # stderr and exits **0** with empty stdout. An exit-status guard
          # alone therefore lets an empty value through, and an empty value
          # interpolated below produces a malformed ARN rather than no policy.
          # Empty is treated exactly as unreadable.
          #
          # The pattern is the other half. A CloudFront distribution id is `E`
          # followed by upper-case alphanumerics, and `distribution_id` sits one
          # output away from `distribution_arn` in
          # `modules/static-site/outputs.tf`. An edit that returned the ARN
          # would compose `arn:<p>:cloudfront::<acct>:distribution/arn:<p>:...`
          # here — syntactically valid, matching no resource, and therefore
          # denying the destroy its own calls by the mechanism described above.
          # Anything that is not an id is emptied and falls through to the
          # fail-open branch.
          dist_id_raw="$(terraform -chdir="envs/${ENVIRONMENT}" output -raw distribution_id || true)"
          dist_id=""
          if [[ "$dist_id_raw" =~ ^E[A-Z0-9]{9,25}$ ]]; then
            dist_id="$dist_id_raw"
          fi

          if [ -z "$dist_id" ] || [ -z "$partition" ] || [ -z "$account" ]; then
            # Fail **open**, deliberately. An unreadable id means the destroy
            # runs on the credential it runs on today, which makes this a bypass
            # by construction and is exactly why A4 is described as
            # defence-in-depth rather than as a boundary — the apply path holds
            # the same unnarrowed credential, and nothing here closes a route
            # against somebody holding it. Failing closed instead would refuse
            # to tear an environment down because a value could not be read,
            # leaving a live distribution running. That is the worse outcome, so
            # the fallback is loud rather than fatal.
            echo "::warning::could not build the destroy-time session policy" \
              "(distribution id: ${dist_id_raw:-unreadable}, partition:" \
              "${partition:-unreadable}, account id: ${account:-unreadable})," \
              "so this destroy will run on the" \
              "unnarrowed apply credential. This is a defence-in-depth control" \
              "and not a boundary; see docs/CLOUDFRONT_IAM_SCOPING_PLAN.md A4"
          else
            # `acm:DeleteCertificate` is deliberately **not** in this Deny.
            # This paragraph exists so that its absence does not read as an
            # oversight and is not helpfully restored by the next editor.
            #
            # An earlier draft added the action and carved the `certificate_arn`
            # output out of the `NotResource`, on the reading that this
            # environment's own certificate must stay deletable. That output
            # does not mean what the draft needed it to mean.
            # `modules/static-site/certificate.tf` sets
            # `manage_certificate = local.custom_domain_enabled && var.acm_certificate_arn == null`,
            # and `local.viewer_certificate_arn` — which is what
            # `modules/static-site/outputs.tf` publishes — returns the
            # **caller's** ARN in the unmanaged branch.
            # `modules/static-site/variables.tf` says outright that the module
            # does not create, renew, tag or destroy a supplied certificate and
            # that it survives `terraform destroy`. So when a caller brings a
            # shared certificate, the destroy never calls
            # `acm:DeleteCertificate` at all, and the draft would have carved
            # somebody else's certificate out of a Deny — a control whose whole
            # claim is that it can only subtract, adding.
            #
            # The other branches are no better. With `certificate_arn` null
            # there is nothing to protect and the statement buys nothing. With
            # it non-null, nothing available here distinguishes managed from
            # unmanaged, and denying the delete outright would strand a
            # certificate this environment does own. The ACM half is not
            # buildable from root outputs, so it is left out rather than left
            # wrong.
            #
            # Reinstating it needs the managed/unmanaged distinction from
            # somewhere that carries it: `terraform show -json` filtered for
            # `aws_acm_certificate` / `aws_acm_certificate_validation` under
            # `.values.root_module.child_modules[0].resources[]` — the read A4
            # defers along with the twelve untaggable actions — or a new module
            # output stating ownership rather than the ARN. Not from
            # `certificate_arn`.
            #
            # One `Deny`, one service, and that is a rule rather than an
            # accident of there being only one left: `NotResource` is evaluated
            # per statement, so merging two services into one Deny carves each
            # service's ARN out of the other service's deny. A second service
            # gets a second statement.
            deny_actions='"cloudfront:DeleteDistribution","cloudfront:UpdateDistribution"'
            not_resource="\"arn:${partition}:cloudfront::${account}:distribution/${dist_id}\""

            # The `{"Effect":"Allow","Action":"*","Resource":"*"}` below looks
            # like it defeats the point of the document and is the one line here
            # that must not be removed.
            #
            # A session's permissions are the **intersection** of the role's
            # identity policy and the session policy — AssumeRoleWithWebIdentity's
            # own wording, quoted in docs/CLOUDFRONT_IAM_SCOPING_ANALYSIS.md
            # section 3.8. A document carrying only the Deny therefore intersects
            # the role's grants with nothing at all and yields an *empty*
            # permission set, not a narrowed one: the destroy would die on its
            # first `s3:GetObject` reading the state file, long before CloudFront
            # is reached, and the control added to make teardown safer would be
            # the thing that stranded the environment. The Allow is what makes
            # this document mean "the role's policy, minus this Deny".
            #
            # `NotResource` rather than an Allow naming the ARN, for the same
            # reason from the other side: a positive Allow would have to restate
            # every permission a destroy needs — S3, CloudWatch Logs, SSM, IAM,
            # the log-delivery APIs — and would be wrong the first time the
            # module grew a resource type. The Deny subtracts; the Allow above
            # carries everything else through untouched.
            policy="{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Action\":\"*\",\"Resource\":\"*\"},{\"Effect\":\"Deny\",\"Action\":[${deny_actions}],\"NotResource\":[${not_resource}]}]}"

            # Printed with its length because the plaintext limit on a session
            # policy is 2,048 characters and this is the only place the real
            # figure is visible. There are exactly two forms this can take now:
            # the empty string, and this one — 256 or 257 characters against a
            # real 13- or 14-character distribution id in the `aws` partition,
            # 264 at most in `aws-us-gov`, and 276 at the 26-character ceiling
            # the shape check above imposes. An earlier comment said ~370;
            # that was the with-certificate figure, and the certificate is gone.
            echo "session policy (${#policy} of 2048 characters): ${policy}"
          fi

          printf 'session-policy=%s\n' "$policy" >> "$GITHUB_OUTPUT"

      # A second `AssumeRoleWithWebIdentity` against the same role, not a
      # different role and not a second grant. A session policy can only
      # subtract — the session's permissions are the intersection of the role's
      # identity policy and this document — so there is no version of this step
      # that widens anything, and no bootstrap change stands behind it. That is
      # the property that makes A4 reversible by `git revert` where the IAM tag
      # conditions are a hand-run `PutRolePolicy` across every apply role.
      #
      # `continue-on-error: true`, and it is the line that keeps this control
      # fail-open rather than fail-closed. Everything in the step above is
      # written so it cannot exit non-zero — but this step is a live
      # `AssumeRoleWithWebIdentity`, and a live call fails for reasons no guard
      # upstream can prevent: STS throttling, a `MalformedPolicyDocument` on a
      # document this file composed wrong, a trust-policy edit landing
      # mid-flight. Without this line such a failure is red, "Apply the plan"
      # below inherits the default `if: success()` and is **skipped**, and the
      # run ends having destroyed nothing with the environment still standing.
      # A control added to make teardown safer would have become the thing that
      # stranded it. With it, the failure is reported by the step below and the
      # destroy proceeds on the credential it has always run on — the same
      # fallback the unreadable-output path takes.
      #
      # The `!= ''` half is that other fallback: when the policy could not be
      # built this step is skipped, and a skipped step also leaves
      # "Apply the plan" running. This control is defence-in-depth, not a
      # boundary.
      #
      # A distinct session name so CloudTrail separates the narrowed session
      # from the wide one this job assumed before `init`.
      - name: Re-assume the apply role for the destroy, narrowed
        id: reassume
        if: inputs.action == 'destroy' && steps.session-policy.outputs.session-policy != ''
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: destroy-narrowed-${{ inputs.environment }}-${{ github.run_id }}
          inline-session-policy: ${{ steps.session-policy.outputs.session-policy }}

      # `continue-on-error` hides the failure from the job's status, which is
      # the whole point of it — so the failure is re-surfaced here as a warning
      # instead. Without this the narrowing could stop working entirely and
      # every run would still be green. The action leaves the credentials it did
      # not replace in place, so the destroy that follows runs on the wide
      # session assumed before `init`, which is the documented fallback.
      - name: Warn if the destroy could not be narrowed
        if: always() && steps.reassume.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::the narrowed re-assume failed, so this destroy runs" \
            "on the unnarrowed apply credential. This is a defence-in-depth" \
            "control and not a boundary, so the destroy is allowed to proceed;" \
            "see docs/CLOUDFRONT_IAM_SCOPING_PLAN.md A4"

      # No `-auto-approve`, and its absence is the point: applying a saved plan
      # never prompts, because the decision it would prompt for was made when
      # the plan was approved. The flag would be inert here and would suggest,
      # to the next person reading this file, that a fresh plan is being
      # applied.
      #
      # A destroy runs through this same line. The plan it applies is the
      # `-destroy` plan from the job above; there is no `terraform destroy`
      # anywhere in this workflow, and that is what keeps the two actions on
      # one audited path.
      - name: Apply the plan
        shell: bash
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          terraform -chdir="envs/${ENVIRONMENT}" apply \
            -no-color \
            -input=false \
            -lock-timeout=10m \
            terraform.tfplan
