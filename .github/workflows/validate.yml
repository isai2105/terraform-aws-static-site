# Validation that runs on every pull request.
#
# Nine jobs, none of which needs an AWS account, a role or a state bucket: the
# Terraform job runs `init -backend=false`, TFLint runs with the AWS ruleset's
# deep-check rules off, Trivy and terraform-docs read the HCL statically, the
# module tests configure their providers with credentials that cannot reach AWS,
# and the other four never touch a cloud provider at all. That is what lets this
# gate land before the code it gates, and what keeps it fast enough to be a
# required check.
#
# Eight of the nine are required checks in the branch ruleset. The ninth,
# `audit-online`, is deliberately not one and cannot be: it needs a GitHub
# token, and one of the audits it runs reports on an advisory database rather
# than on this tree, so it can go red on a Tuesday without this repository
# having changed. It runs here anyway, and where a reader of the Checks list
# will ask why it is not required, the answer is with the `audit-online` target
# in the Makefile and repeated in short beside the job below.
#
# ---------------------------------------------------------------------------
# The hardening these workflow files share
# ---------------------------------------------------------------------------
#
# Six rules, one policy, applied to every workflow in the repository in a single
# diff rather than to each as it was written — and stated here in full, because
# plan.yml and apply.yml follow the same six and should not each carry their own
# copy of the argument.
#
# Who holds which rule, because a green check reads as though it had read the
# whole list and it has not. Measured against zizmor 1.29.0 and actionlint
# 1.7.12 rather than assumed:
#
#   rules 1, 3, 6   the `zizmor` job below, through `unpinned-uses` (high),
#                   `excessive-permissions` (medium) and `artipacked` (medium).
#   rules 4, 5      `make audit-policy`, which the same job runs — two anchored
#                   greps, because at no persona and in neither mode does zizmor
#                   say anything about a `runs-on: ubuntu-latest` or about a job
#                   with no `timeout-minutes`, and actionlint has no rule for
#                   either.
#   rule 2          nobody. The node24 check has no tool at all, offline or on,
#                   and rule 2 says so where it is written.
#
# Rule 1 is split, which is the one place this list is finer than it looks. That
# a `uses:` is pinned at all is zizmor's; that the version comment beside the
# pin is the tag it claims is `ref-version-mismatch`'s, and that audit does not
# run offline — so it is `make audit-online`, which the `audit-online` job below
# runs on every pull request. The split is still worth writing out, because what
# it costs is visible in the Checks list: rule 1's first half blocks a merge and
# its second half goes red beside a merge button that still works.
#
# `actionlint` covers none of the six and is not the weaker linter for it: it
# checks a workflow's syntax, its expressions and, through shellcheck, its `run:`
# blocks. A mistyped `permissions:` key is its finding and not zizmor's; an
# over-broad one is zizmor's and not its. The two run in both directions and
# neither has a timeout rule.
#
# Writing the division out is the point rather than a footnote to it. Two more
# workflows are authored after this commit, and one of them is `e2e.yml`, the
# only file in the repository that holds an apply role — stage's — with nobody
# watching, destroying real infrastructure on a schedule. One rule of the six
# reaches it through a person reading this list, and the list has to say which.
#
# 1. Every `uses:` is a full commit SHA, with the version tag beside it as a
#    comment. A tag can be moved, a commit cannot. The comment is not
#    decoration: each SHA here was produced by dereferencing that tag through
#    the GitHub API rather than copied out of a README, and it is what the next
#    bump gets read against — including by Dependabot, which is now the thing
#    doing the bumping: .github/dependabot.yml, weekly, every action in one
#    grouped pull request. One zizmor audit checks that pairing,
#    `ref-version-mismatch`, and a second, `impostor-commit`, checks the
#    narrower thing that the SHA belongs to the repository it is written
#    against at all. Neither runs offline, so neither runs in the `zizmor` job
#    below. **The `audit-online` job below runs both, on every pull request**,
#    which is where a moved pin arrives whether Dependabot moved it or a person
#    did. The measurement behind that sentence is with the `audit` target in
#    the Makefile.
#
# 2. Every pinned SHA declares `using: node24` in that action's own `action.yml`
#    at that SHA — checked when the pin is written and again when it is bumped.
#    A SHA pin freezes the action's JavaScript runtime along with its code, and
#    Node 20 stopped being the runner default on 16 June 2026 and is removed
#    from runners on 23 September 2026: a node20-era pin therefore works
#    perfectly right up to that date and then fails everywhere at once. Nothing
#    about such a pin is malformed, so neither actionlint nor zizmor has a word
#    to say about it — one of the three rules held by hand rather than by a
#    tool, and the only one of them with a deadline. Of the eight actions used
#    across these files, seven are `node24`; `aquasecurity/setup-trivy` is a
#    composite action and has no JavaScript runtime to pin.
#
#    What .github/dependabot.yml changes is not the rule but how often it comes
#    due. The obligation used to arrive whenever somebody chose to bump a pin;
#    it now arrives every Tuesday, on a pull request nobody planned, against a
#    date that does not move. Nothing automates it — not zizmor at any persona
#    in either mode, not actionlint, not `make audit-policy`, and not the
#    `audit-online` job below, which reads the tag comment beside a SHA and has
#    no opinion about the runtime declared at it. Opening `action.yml` at each
#    proposed SHA is a person's job, weekly, until 23 September 2026 is behind
#    this repository rather than ahead of it.
#
# 3. `permissions: {}` at workflow level, with the minimum granted per job. An
#    empty block is not the same as no block: with no block at all every job
#    inherits the repository's default token permissions, which is a setting
#    outside this file and can be widened without touching it. Written out, the
#    default is nothing and every grant below is a line somebody chose to add.
#
# 4. `runs-on: ubuntu-24.04`, never `ubuntu-latest`, for the reason Terraform is
#    pinned to a patch and the provider to a minor. The floating label has
#    already moved once, from 22.04 to 24.04, and will move again on a schedule
#    GitHub picks rather than this repository. `ubuntu-22.04` is not the
#    alternative — it begins brownout on 17 September 2026. The image is a pin
#    like the toolchain's, and it lives in the same place they do: `RUNNER_IMAGE`
#    in the Makefile, which `make audit-policy` checks every `runs-on:` in this
#    directory against. Changing the image is a one-line change there.
#
# 5. `timeout-minutes` on every job. GitHub's default is six hours, and the
#    failure shape in an infrastructure pipeline is a hang rather than a crash:
#    a state lock waited on indefinitely, a provider waiter that does not
#    return. Fifteen minutes here and in plan.yml; apply.yml carries larger
#    numbers and argues them where they sit. They are deliberately loose, and
#    the looseness is the point — a timeout that fires on a slow success is
#    worse than no timeout, so what these bound is a wedged runner rather than a
#    slow one. That every job has one is checked by `make audit-policy`, which
#    counts rather than matches: it can say a file is one timeout short and not
#    which job is short of it.
#
# 6. Every `checkout` sets `persist-credentials: false`. The action otherwise
#    writes the job's token into `.git/config`, where every later step of the
#    job can read it — a `terraform` invocation resolving a module, anything
#    shipped inside a third-party action, anything that reads the working tree.
#    Nothing in this repository pushes, so nothing needs it. This is zizmor's
#    `artipacked` finding — it reported ten, one for every checkout that existed
#    when it first ran here — and the one rule of the six that came from the
#    tool rather than from the policy.

name: validate

on:
  pull_request:
    # `edited` matters: without it a pull request whose title was rejected and
    # then corrected would never be re-checked.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

# Nothing by default, granted back one job at a time below. Rule 3 above.
permissions: {}

jobs:
  # Format and validity of the Terraform sources, driven through the Makefile
  # so that CI and a local shell run the identical commands.
  terraform:
    name: terraform
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the pinned Terraform version
        id: terraform-version
        # setup-terraform has no version-file input and defaults to `latest`,
        # so .terraform-version has to be read here and passed in explicitly.
        run: echo "version=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.terraform-version.outputs.version }}
          # The wrapper only exists to capture stdout as step outputs, which
          # nothing here consumes, and the Makefile's guard parses the output
          # of `terraform version` directly.
          terraform_wrapper: false

      - name: Check formatting and validate
        run: make fmt-check validate

  # Everything `terraform validate` has no opinion about: deprecated syntax,
  # instance types that do not exist, declarations nobody reads, names in the
  # wrong case. The AWS ruleset's deep-check rules — the only ones that would
  # call an AWS API — are off by default and left off, so this job needs no
  # account, no role and no credentials either.
  tflint:
    name: tflint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the pinned TFLint version
        id: tflint-version
        # The Makefile is the pin; repeating the number here would let the
        # binary CI installs and the version the Makefile's guard demands
        # drift apart, and the guard would then fail every run.
        run: echo "version=$(make -s print-tflint-version)" >> "$GITHUB_OUTPUT"

      - name: Install TFLint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          tflint_version: v${{ steps.tflint-version.outputs.version }}

      - name: Lint
        env:
          # `tflint --init` downloads the AWS ruleset from the GitHub API,
          # which is rate-limited to 60 requests an hour for anonymous callers
          # sharing a runner's IP. The default token lifts that, and what it
          # can do while lifting it is this job's `permissions:` above and
          # nothing else — the rate limit is raised by the token being
          # authenticated at all, not by anything it is allowed to reach.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make lint

  # Misconfiguration in the infrastructure itself, which neither `terraform
  # validate` nor TFLint has an opinion about: a bucket without encryption, a
  # policy with a wildcard principal, a role anyone can assume. It lands now
  # rather than later because the next thing written here is bootstrap/ — an S3
  # bucket and two IAM roles — and that is the code most worth scanning as it is
  # written. `trivy config` parses HCL statically, so like the jobs above it
  # reaches no AWS API and needs no credentials.
  #
  # tfsec was folded into Trivy in 2023 and is unmaintained; Trivy is the
  # supported successor and kept the AVD check IDs, so the IDs in .trivyignore
  # mean the same thing they always did.
  trivy:
    name: trivy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the pinned Trivy version
        id: trivy-version
        # As with TFLint: the Makefile is the pin. Repeating the number here
        # would let the binary CI installs drift from the version the
        # Makefile's guard demands, and the guard would fail every run.
        run: echo "version=$(make -s print-trivy-version)" >> "$GITHUB_OUTPUT"

      - name: Install Trivy
        # The installer only, not aquasecurity/trivy-action: the action would
        # take the scan's flags as `with:` inputs, which is a second copy of
        # the invocation that `make scan` already owns. Installing the binary
        # and calling the target keeps CI and a local shell running the same
        # command, which is the rule the Makefile is built around.
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v${{ steps.trivy-version.outputs.version }}

      # No GITHUB_TOKEN here, unlike the TFLint job: `make scan` passes
      # --skip-check-update, so Trivy runs the checks compiled into the pinned
      # binary and pulls neither the checks bundle from ghcr.io nor the
      # vulnerability database, which config mode does not use at all. The
      # scan makes no network call, so there is no rate limit to lift.
      - name: Scan
        run: make scan

  # The generated half of each module's README — the requirements, providers,
  # resources, inputs and outputs tables — checked against the `.tf` files it
  # claims to describe. terraform-docs parses HCL and renders markdown, so like
  # everything above it this reaches no AWS API and needs no credentials.
  #
  # This is a check and not a fix: `make docs-check` fails on drift rather than
  # regenerating and pushing. A job that committed its own correction would
  # report green on work nobody reviewed, and would push to a pull request
  # branch — which is why this job's grant below stops at `contents: read`, and
  # why its checkout does not keep the token it arrived with.
  #
  # It is required rather than advisory because the failure it catches is
  # invisible. Stale generated documentation does not break a plan or an apply;
  # it sits beside the module looking authoritative while describing an
  # interface that has moved, and the next three commits that touch this
  # module's inputs and outputs are exactly where that happens. A local hook
  # cannot cover it either: the first commit pushed from a clone without the
  # hook installed is the one that lands the drift.
  terraform-docs:
    name: terraform-docs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the pinned terraform-docs version
        id: terraform-docs-version
        # As with TFLint and Trivy: the Makefile is the pin. The stakes are a
        # little higher here, because this check compares generated text byte
        # for byte — two versions of terraform-docs that disagree about a table
        # would fail every pull request until someone regenerated, on a diff
        # that explains none of it.
        run: echo "version=$(make -s print-terraform-docs-version)" >> "$GITHUB_OUTPUT"

      - name: Install terraform-docs
        env:
          VERSION: ${{ steps.terraform-docs-version.outputs.version }}
        # No action for this one. terraform-docs/gh-actions is a generator
        # rather than an installer: it takes the invocation's flags as `with:`
        # inputs and can commit the result, which is a second copy of what
        # `make docs-check` already owns and a push this workflow must not make.
        # So the release archive is fetched directly and the Makefile target is
        # called, which is the same shape the Trivy job settled on.
        #
        # The archive is verified against the checksum file published beside it.
        # That detects a truncated or corrupted download rather than a
        # compromised release — the release tag is what fixes the contents, as
        # it does for the tflint and trivy binaries above.
        run: |
          workdir="$(mktemp -d)"
          base="https://github.com/terraform-docs/terraform-docs/releases/download/v${VERSION}"
          archive="terraform-docs-v${VERSION}-linux-amd64.tar.gz"
          curl --fail --silent --show-error --location \
            --output "${workdir}/${archive}" "${base}/${archive}"
          curl --fail --silent --show-error --location \
            --output "${workdir}/checksums" "${base}/terraform-docs-v${VERSION}.sha256sum"
          (cd "${workdir}" && sha256sum --ignore-missing --check checksums)
          # The archive also carries a LICENSE and a README; only the binary is
          # extracted, and its directory goes on PATH rather than into a system
          # one, so no step here needs to be root.
          tar -xzf "${workdir}/${archive}" -C "${workdir}" terraform-docs
          echo "${workdir}" >> "$GITHUB_PATH"

      - name: Check the generated module documentation
        run: make docs-check

  # The module's own `terraform test` suite: what a plan can establish about the
  # static-site module, run against the real AWS provider and no AWS account.
  #
  # A separate job from `terraform` above rather than another target on the same
  # one, for the reason every job here is separate: a red check should name what
  # broke. "terraform" failing tells a reader that formatting, validity or the
  # tests are wrong, and the three have nothing to do with one another.
  #
  # It is required rather than advisory because the paths it covers are the ones
  # nothing else can. Every environment in this repository leaves `domain_name`
  # null, so the optional-domain wiring is exercised by no plan, no apply and no
  # end-to-end run — only by these tests. A check that is advisory on the only
  # coverage a code path has is coverage nobody reads.
  #
  # No credentials, no OIDC, and nothing granted below beyond the `contents:
  # read` its checkout needs — deliberate on both sides. `terraform test` is not
  # credential-free on its own: the AWS provider validates credentials when it
  # is configured, before the first assertion, so the test files configure
  # providers that cannot reach AWS. Giving this job credentials anyway would
  # mask that if it ever stopped being true.
  terraform-test:
    name: terraform-test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the pinned Terraform version
        id: terraform-version
        # As in the terraform job above: setup-terraform has no version-file
        # input and defaults to `latest`, so .terraform-version is read here and
        # passed in explicitly.
        run: echo "version=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.terraform-version.outputs.version }}
          terraform_wrapper: false

      - name: Run the module tests
        run: make test

  # Workflow syntax, expression errors and — through shellcheck — bugs in the
  # `run:` blocks above: a mistyped `permissions:` key is otherwise ignored in
  # silence by GitHub, which is to say it grants what it was written to
  # withhold.
  #
  # It holds none of the six rules at the top of this file, which is worth saying
  # rather than leaving to be discovered: this job and the `zizmor` job below run
  # past each other in both directions. actionlint reads a `permissions:` key and
  # says whether it is a key; zizmor reads the block and says whether it is wider
  # than the job. A workflow with a floating `runs-on` and no `timeout-minutes`
  # is clean to both, which is what `make audit-policy` is for. Three checks, no
  # overlap, and the list of which holds what is at the top of the file.
  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint the workflows
        env:
          # Official image, pinned to an exact release and to that release's
          # digest. It ships shellcheck and pyflakes, which actionlint picks up
          # off PATH to check `run:` blocks.
          ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        run: |
          docker run --rm --entrypoint shellcheck "$ACTIONLINT_IMAGE" --version
          docker run --rm -v "$PWD:/repo:ro" --workdir /repo "$ACTIONLINT_IMAGE" -color -verbose

  # The hardening at the top of this file, checked rather than remembered — the
  # three rules zizmor has an audit for, and through `make audit`'s
  # `audit-policy` prerequisite the two it does not. The job's name is `zizmor`
  # because that string is a required status check in the branch ruleset and
  # renaming it would silently stop satisfying one; the target is what says what
  # actually ran.
  #
  # Installed and invoked exactly as Trivy and terraform-docs are: the Makefile
  # holds the pin, this job reads it back, and the check is `make audit` rather
  # than a second copy of the invocation written in YAML. The obvious
  # alternative, zizmorcore/zizmor-action, loses on the argument that already
  # ruled out trivy-action and terraform-docs/gh-actions — it takes the flags as
  # `with:` inputs, so the hook in .pre-commit-config.yaml could not run the
  # same command as this job, and its SARIF upload asks for
  # `security-events: write` to publish a report nothing here reads.
  #
  # No token, and that is not an omission this job would survive by accident:
  # zizmor selects offline or online mode from whether one is in the
  # environment, and the mode moves the verdict. `make audit` passes `--offline`
  # so that the presence of a token changes nothing, here or in a contributor's
  # shell. The measurement behind that is with the target in the Makefile.
  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the pinned zizmor version
        id: zizmor-version
        # As with TFLint, Trivy and terraform-docs: the Makefile is the pin, and
        # `check-zizmor` demands this exact version of whatever the step below
        # installs, so the two cannot drift without the target saying so.
        run: echo "version=$(make -s print-zizmor-version)" >> "$GITHUB_OUTPUT"

      - name: Install zizmor
        env:
          VERSION: ${{ steps.zizmor-version.outputs.version }}
        # No action for this one, and — unlike the terraform-docs job above — no
        # checksum file to verify against: the release publishes five archives
        # and nothing beside them. Less is lost there than it looks. That
        # checksum detects a truncated or corrupted download rather than a
        # compromised release, the release tag being what fixes the contents in
        # both cases; a truncated gzip stream fails in `tar` here anyway, and a
        # binary that is not the pinned one fails in `check-zizmor` one step
        # later.
        #
        # The archive holds the binary alone. Its directory goes on PATH rather
        # than into a system one, so no step here needs to be root.
        run: |
          workdir="$(mktemp -d)"
          archive="zizmor-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --silent --show-error --location \
            --output "${workdir}/${archive}" \
            "https://github.com/zizmorcore/zizmor/releases/download/v${VERSION}/${archive}"
          tar -xzf "${workdir}/${archive}" -C "${workdir}" zizmor
          echo "${workdir}" >> "$GITHUB_PATH"

      - name: Audit the workflows
        run: make audit

  # The five audits `make audit` cannot run, on every pull request — and the one
  # job in this file that is deliberately not a required check.
  #
  # It exists because rule 1 above is split and the second half had no
  # enforcement at all. `ref-version-mismatch` compares a SHA pin against the
  # `# vX.Y.Z` comment written beside it, and it does not run offline: measured
  # at zizmor 1.29.0 on this repository, rewriting one `# v7.0.1` comment to
  # `# v4.1.1` produces nothing from `make audit` and one medium
  # `warning[ref-version-mismatch]` here, with `make audit-online` exiting 2.
  # Until now the answer to that was a sentence asking a person to remember. It
  # is now a job, which is the only form the answer can take once
  # .github/dependabot.yml is opening the pull requests that move those pins.
  #
  # **A separate job, never a second step in `zizmor` above.** That job is a
  # required check, and folding this into it would make a required check depend
  # on a credential and on GitHub's advisory database — the two properties the
  # `audit-online` target in the Makefile argues at length disqualify it from
  # ever being a gate. One half of that argument is weaker than it was written:
  # a Dependabot pull request's read-only token does satisfy this job, so "the
  # required set is kept credential-free so bot pull requests can satisfy it"
  # is not what rules this out. The other half is untouched and decides it on
  # its own — `known-vulnerable-actions` reports on a database that moves
  # without a commit, so a required check running it could take `main` red on a
  # Tuesday with nothing in this repository having changed.
  #
  # Not required, and not `continue-on-error: true` either. That flag renders a
  # failure as a green tick with an annotation beside it, which is the "green
  # check nobody reads" shape this repository turns down everywhere else. A
  # non-required job that fails shows a red cross in the Checks list while the
  # merge button stays enabled: the reviewer sees it and decides, which is
  # exactly the weight this check should carry.
  #
  # No `paths:` filter, and not out of laziness. A `paths:` at workflow level
  # would apply to all nine jobs and stop the eight required ones reporting on
  # any pull request that touches no workflow file — which leaves them
  # "Expected — Waiting for status" forever, the trap `plan-gate` exists in
  # plan.yml to disarm. A per-job filter would work and is still not worth it:
  # this job costs about three seconds (measured, twice, at 2.8s and 2.2s), and
  # running it unconditionally removes the whole class of bug where a path
  # pattern and the files that actually matter drift apart. That is the
  # argument plan.yml's `detect` job makes against `dorny/paths-filter`,
  # applied here.
  #
  # The token is a rate limit lifted, not an authorisation granted. All five
  # online audits are public reads — `ref-version-mismatch` and
  # `impostor-commit` list refs on github.com, `known-vulnerable-actions` reads
  # `api.github.com/advisories` — and none of them needs a permission this job
  # could be given. It is the same property the `tflint` job above relies on
  # and says so about: the rate limit is raised by the token being
  # authenticated at all, not by anything it is allowed to reach. So the grant
  # below stops at the `contents: read` the checkout needs.
  audit-online:
    name: audit-online
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the pinned zizmor version
        id: zizmor-version
        # The same pin the `zizmor` job above reads, from the same place. Two
        # jobs running two versions of the same binary against the same tree
        # would be two answers with nothing to say which is current.
        run: echo "version=$(make -s print-zizmor-version)" >> "$GITHUB_OUTPUT"

      - name: Install zizmor
        env:
          VERSION: ${{ steps.zizmor-version.outputs.version }}
        # Installed exactly as the `zizmor` job above installs it, down to the
        # archive name and the missing checksum file, and the reasoning is
        # written out there rather than repeated here.
        run: |
          workdir="$(mktemp -d)"
          archive="zizmor-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --silent --show-error --location \
            --output "${workdir}/${archive}" \
            "https://github.com/zizmorcore/zizmor/releases/download/v${VERSION}/${archive}"
          tar -xzf "${workdir}/${archive}" -C "${workdir}" zizmor
          echo "${workdir}" >> "$GITHUB_PATH"

      - name: Audit the workflows against the GitHub API
        env:
          # `make audit-online` refuses to run without one rather than letting
          # zizmor fall back to offline and report a clean pass having skipped
          # every audit this job exists for. On a pull request from a fork this
          # is still issued and still read-only, which is all the target needs.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make audit-online

  # The pull request title becomes the subject of the squashed commit, so it is
  # checked with the same rigour as the code. Skipped on push, where there is
  # no pull request to read a title from; main only ever receives commits
  # through a pull request, so the title has always been checked by then.
  pr-title:
    name: pr-title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The only job here that checks nothing out and calls no API: the title it
    # reads arrives in the event payload, which is not a resource a token grants
    # access to. So it keeps the workflow-level nothing, and a `contents: read`
    # added here out of symmetry would be a grant with no reader.
    permissions: {}
    steps:
      - name: Check the title against Conventional Commits
        env:
          # Passed through the environment, never interpolated into the script:
          # a title is attacker-controlled text and `${{ ... }}` would splice it
          # straight into the shell.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|test|build|ci|chore|perf|revert)(\([^()]+\))?!?: .+$'
          if printf '%s' "$PR_TITLE" | grep -Eq "$pattern"; then
            echo "ok: $PR_TITLE"
            exit 0
          fi
          {
            echo "The pull request title is not a Conventional Commit."
            echo
            echo "  title:    $PR_TITLE"
            echo "  expected: <type>[(scope)][!]: <subject>"
            echo "  types:    feat fix docs style refactor test build ci chore perf revert"
            echo
            echo "  example:  ci: add pull-request validation for format and syntax"
          } >&2
          exit 1
